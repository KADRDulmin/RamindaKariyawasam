        <h1>Raminda Kariyawasam — Full-Stack Software Engineer</h1>
        <p>Full-stack software engineer building AI-enabled university platforms, optimization systems, secure enterprise applications, and production infrastructure. Associate Software Engineer at NSBM Green University and University of Plymouth BSc (Hons) Software Engineering graduate, class of 2025.</p>

        <h2>About</h2>
        <p>Raminda works across controlled Gemini tools, document-grounded retrieval, OR-Tools constraint optimization, TypeScript and Node.js, Java and Spring, PHP, Python, databases, security boundaries, deployment, and observability. His public portfolio separates implemented work from prototypes and specifications.</p>

        <h2>Career</h2>
        <ul>
          <li>2025 – present: Associate Software Engineer at NSBM Green University — internal university systems, AI integrations, public mobile apps</li>
          <li>2022 – 2023: UI Developer Intern at Iplay Global — HTML, CSS, JavaScript and UI frameworks on client web builds</li>
          <li>2020 – 2022: Infigo Developers (Start-up) — WordPress development, React and Angular fundamentals</li>
          <li>2022 – 2025: BSc (Hons) Software Engineering, University of Plymouth, UK — Graduated 2025</li>
          <li>2020 – 2021: IT Foundation, NSBM Green University, Sri Lanka</li>
        </ul>

        <h2>Featured Engineering</h2>
        <ul>
          <li><strong>UMIS Student Portal / GreenMate AI</strong> — Next.js portal with an authenticated Gemini function-calling loop, server-owned student identity, tool-level controls, rate limiting, and usage accounting.</li>
          <li><strong>NSBM RAG Bot</strong> — PHP retrieval assistant using Gemini File Search, with an embeddable widget, dataset administration, signed requests, origin controls, and rate limiting.</li>
          <li><strong>Timetable Generator Gen2</strong> — Next.js and private FastAPI system using OR-Tools CP-SAT for full-semester timetabling and explicit hall-allocation conflicts.</li>
          <li><strong>US Deed Management</strong> — In-development Angular and Spring Boot prototype for multi-county deed search, saved research, administration, and bulk-ingestion workflows.</li>
        </ul>

        <h2>NSBM Green University Internal Projects</h2>
        <p>Built as part of the NSBM development team: GreenMate and the UMIS Student Portal, NSBM RAG Bot, Timetable Generator Gen2, UMIS 2.0 foundation, ExamTrack, Enroll-Now Portal, Research Publications Portal, Library Management Portal, Registration Kiosk, NSBM Intranet, Job Portal, Timetable Generator Gen1, Campus Lunch Ordering, BOC Payment Portal, and SDG Widget. These private projects intentionally expose no repository links.</p>

        <h2>Skills</h2>
        <ul>
          <li>AI and optimization: Gemini function calling, RAG and File Search, OR-Tools CP-SAT, tool controls, local speech design</li>
          <li>Frontend: React, Next.js, Angular, TypeScript, Flutter, responsive UI, accessibility</li>
          <li>Backend: Node.js, NestJS, Express, Java, Spring Boot, PHP, Python, FastAPI</li>
          <li>Data and security: MySQL, PostgreSQL, MongoDB, Redis, Entra ID, OAuth/JWT, RBAC, audit trails</li>
          <li>Operations: Docker, GitHub Actions, AWS, Linux, Apache/Nginx, Sentry, migrations, observability</li>
        </ul>
