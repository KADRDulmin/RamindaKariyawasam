<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <base href="{{PUBLIC_PATH}}" />

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="{{THEME_COLOR}}" />
    <link rel="canonical" href="{{PUBLIC_URL}}" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{PUBLIC_URL}}" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE_URL}}" />
    <meta property="og:image:secure_url" content="{{OG_IMAGE_URL}}" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{COUPLE_NAMES}} — celebrating 25 years together" />
    <meta property="og:site_name" content="{{COUPLE_NAMES}} Anniversary Invitation" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{PUBLIC_URL}}" />
    <meta name="twitter:title" content="{{PAGE_TITLE}}" />
    <meta name="twitter:description" content="{{PAGE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE_URL}}" />
    <meta name="twitter:image:alt" content="{{COUPLE_NAMES}} — celebrating 25 years together" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="assets/images/hero-941.webp"
      imagesrcset="assets/images/hero-480.webp 480w, assets/images/hero-760.webp 760w, assets/images/hero-941.webp 941w"
      imagesizes="(max-width: 820px) 100vw, 62vw"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="anniversary.bundle.css" />

    <script type="application/ld+json">
{{STRUCTURED_DATA}}
    </script>
  </head>

  <body>
    <div id="anniversary-root">
      <main class="app-loading" aria-label="Loading anniversary invitation">
        <div class="app-loading-mark" aria-hidden="true">{{MONOGRAM}} <span>25</span></div>
        <p>{{COUPLE_NAMES}}</p>
      </main>
    </div>

    <noscript>
      <main class="noscript-invitation">
        <p class="eyebrow">A silver jubilee celebration</p>
        <h1>{{COUPLE_NAMES}}</h1>
        <h2>{{HEADLINE}}</h2>
        <p>{{INVITATION_MESSAGE}}</p>
        <dl>
          <div><dt>Date</dt><dd>{{DATE_LABEL}}</dd></div>
          <div><dt>Time</dt><dd>{{TIME_LABEL}} ({{TIME_ZONE}})</dd></div>
          <div><dt>Venue</dt><dd>{{VENUE_NAME}}, {{VENUE_ADDRESS}}</dd></div>
        </dl>
        <p class="noscript-actions">
          <a href="{{CALENDAR_FILE}}" download>Download calendar event</a>
          <a href="{{DIRECTIONS_URL}}" target="_blank" rel="noopener noreferrer">Get directions</a>
          <a href="{{VENUE_WEBSITE}}" target="_blank" rel="noopener noreferrer">Venue website</a>
        </p>
        <p>Enable JavaScript to use the countdown, full-screen gallery, sharing, map, calendar options, and RSVP form.</p>
      </main>
    </noscript>

    <script src="anniversary.bundle.js" defer></script>
  </body>
</html>
